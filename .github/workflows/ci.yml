name: CI
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'relay-rush-source.tar.xz.b64'
      - '.github/workflows/bootstrap.yml'
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
